title: FortiGate SSL-VPN Credential Stuffing Burst
status: experimental
description: >
  Detects a single source IP attempting SSL-VPN logins against an
  abnormally high number of distinct usernames within a short window --
  the signature of a credential-stuffing or username-spray attack against
  an internet-facing FortiGate SSL-VPN portal (T1110.004, T1190). Keys on
  distinct usernames per source IP rather than raw failure count, so a
  single legitimate user's typo doesn't trigger it.
references:
  - ../../hunts/initial-access/fortigate-sslvpn-initial-access.md
tags:
  - attack.t1110.004
  - attack.t1190
  - attack.t1133
logsource:
  product: fortios
  service: vpn
detection:
  selection:
    subtype: vpn
    action: ssl-login-fail
  timeframe: 10m
  condition: selection | count(user) by srcip > 5
falsepositives:
  - Vulnerability scanners or pentest engagements explicitly authorized
    against the SSL-VPN portal -- allowlist by scheduled scan window/IP
  - None expected from normal user behavior -- a real user's failed logins
    are against their own username, not a spread of distinct accounts
level: high
